<!DOCTYPE html>
<!-- Reset password page: consumes a token from /reset-password/<token> and signs the athlete in after success. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goalbazi - Set New Password</title>
  <link rel="icon" type="image/svg+xml" href="/assets/goalbazi-logo.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/goalbazi-logo.svg">
  <meta name="theme-color" content="#07110d">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .password-field { position: relative; }
    .password-field input { padding-right: 48px; }
    .password-toggle {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--muted-2);
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body class="goalbazi-app-bg">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-theme-corner">
        <button class="theme-toggle" id="reset-theme-toggle" type="button" data-theme-toggle></button>
      </div>
      <div class="auth-logo">
        <img src="/assets/goalbazi-logo.svg" alt="Goalbazi">
        <span>Goalbazi</span>
      </div>
      <h1 class="auth-title">Choose new password</h1>
      <p class="auth-sub">Use at least 8 characters. After reset, you will be signed in automatically.</p>
      <form class="auth-form" id="reset-form">
        <label>
          <span>New password</span>
          <div class="password-field">
            <input class="form-input" id="new-password" type="password" name="password" placeholder="New password" minlength="8" required autocomplete="new-password">
            <button class="password-toggle" type="button" data-toggle-password="new-password" aria-label="Show password">👁</button>
          </div>
        </label>
        <label>
          <span>Confirm password</span>
          <div class="password-field">
            <input class="form-input" id="confirm-password" type="password" name="confirm_password" placeholder="Re-enter password" minlength="8" required autocomplete="new-password">
            <button class="password-toggle" type="button" data-toggle-password="confirm-password" aria-label="Show confirm password">👁</button>
          </div>
        </label>
        <p class="error-msg" id="error-msg"></p>
        <button class="btn btn-primary btn-full" type="submit" id="submit-btn">Reset password</button>
      </form>
      <p class="auth-switch"><a href="/login">Back to login</a></p>
    </div>
  </div>
  <script src="/nav.js"></script>
  <script>
    GoalbaziTheme.attachButton(document.getElementById("reset-theme-toggle"));
    const token = decodeURIComponent(window.location.pathname.split("/").pop() || "");

    // Keep reset-page password reveal behavior consistent with login/register.
    document.querySelectorAll("[data-toggle-password]").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.togglePassword);
        const shouldShow = input.type === "password";
        input.type = shouldShow ? "text" : "password";
        button.setAttribute("aria-label", shouldShow ? "Hide password" : "Show password");
      });
    });

    document.getElementById("reset-form").addEventListener("submit", async event => {
      event.preventDefault();
      const err = document.getElementById("error-msg");
      const btn = document.getElementById("submit-btn");
      const data = Object.fromEntries(new FormData(event.currentTarget).entries());
      err.style.display = "none";
      if (data.password !== data.confirm_password) {
        err.textContent = "Passwords do not match.";
        err.style.display = "block";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Resetting...";
      try {
        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password: data.password }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || "Password reset failed");
        window.location.href = "/dashboard";
      } catch (error) {
        err.textContent = error.message || "Password reset failed.";
        err.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Reset password";
      }
    });
  </script>
</body>
</html>
