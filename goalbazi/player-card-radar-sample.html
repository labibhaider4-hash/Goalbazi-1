<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goalbazi Player Card Radar Sample</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020806;
      --panel: rgba(9, 29, 19, .82);
      --line: rgba(170,255,194,.15);
      --text: #f3fff6;
      --muted: #96c9ad;
      --brand: #7fff45;
      --accent: #31e88f;
      --gold: #ffd86a;
      --danger: #ff725f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(127,255,69,.16), transparent 36%),
        linear-gradient(180deg, #020806, #06170f 58%, #010302);
    }

    .card {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 18px;
      border: 1px solid var(--line);
      border-radius: 34px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(9,29,19,.86), rgba(5,16,11,.82));
      box-shadow: 0 34px 100px rgba(0,0,0,.40);
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: conic-gradient(from 180deg, transparent, rgba(127,255,69,.12), transparent 24%);
      animation: sweep 8s linear infinite;
      opacity: .55;
    }

    .player-panel,
    .radar-panel {
      position: relative;
      z-index: 1;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: rgba(255,255,255,.025);
      backdrop-filter: blur(18px);
      padding: 20px;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
    }

    .score {
      font-family: "Syne", sans-serif;
      font-size: 4.2rem;
      font-weight: 800;
      letter-spacing: -.08em;
      line-height: .8;
      color: var(--brand);
      text-shadow: 0 0 28px rgba(127,255,69,.20);
    }

    .role {
      text-align: right;
      color: var(--gold);
      font-weight: 900;
      letter-spacing: .14em;
      font-size: .82rem;
    }

    .avatar {
      width: 132px;
      height: 132px;
      border-radius: 34px;
      display: grid;
      place-items: center;
      margin: 8px auto 16px;
      background: linear-gradient(135deg, var(--brand), var(--accent));
      color: #061008;
      font-family: "Syne", sans-serif;
      font-size: 3.4rem;
      font-weight: 800;
      box-shadow: 0 0 48px rgba(127,255,69,.18);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-family: "Syne", sans-serif;
      font-size: clamp(1.8rem, 6vw, 3rem);
      letter-spacing: -.07em;
      line-height: .9;
    }

    .meta {
      text-align: center;
      color: var(--muted);
      margin: 10px 0 18px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
    }

    .tag.gold {
      color: var(--gold);
      border-color: rgba(255,216,106,.22);
      background: rgba(255,216,106,.08);
    }

    .radar-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .radar-head h2 {
      margin: 0;
      font-family: "Syne", sans-serif;
      letter-spacing: -.05em;
    }

    .radar-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .radar-wrap {
      display: grid;
      grid-template-columns: 1fr 190px;
      gap: 16px;
      align-items: center;
    }

    svg {
      width: 100%;
      max-height: 390px;
      overflow: visible;
    }

    .axis {
      stroke: rgba(170,255,194,.16);
      stroke-width: 1;
    }

    .grid {
      fill: none;
      stroke: rgba(170,255,194,.13);
      stroke-width: 1;
    }

    .shape {
      fill: rgba(127,255,69,.24);
      stroke: var(--brand);
      stroke-width: 3;
      filter: drop-shadow(0 0 16px rgba(127,255,69,.32));
    }

    .point {
      fill: var(--brand);
      stroke: #061008;
      stroke-width: 2;
    }

    .label {
      fill: var(--text);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .05em;
    }

    .stat-list {
      display: grid;
      gap: 9px;
    }

    .stat {
      display: grid;
      grid-template-columns: 44px 1fr 34px;
      gap: 9px;
      align-items: center;
      font-size: .86rem;
    }

    .stat-code {
      color: var(--brand);
      font-weight: 900;
    }

    .bar {
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--brand), var(--accent));
    }

    .stat-value {
      font-weight: 900;
      color: var(--text);
      text-align: right;
    }

    @keyframes sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 760px) {
      .card { grid-template-columns: 1fr; border-radius: 28px; }
      .radar-wrap { grid-template-columns: 1fr; }
      .score { font-size: 3.4rem; }
      .avatar { width: 112px; height: 112px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="player-panel">
      <div class="topline">
        <div class="score">82</div>
        <div class="role">MID<br>7v7</div>
      </div>
      <div class="avatar">LH</div>
      <h1>Labib Haider</h1>
      <div class="meta">@labib · Lucknow · Intermediate</div>
      <div class="tags">
        <span class="tag gold">Founder Athlete</span>
        <span class="tag">Midfielder</span>
        <span class="tag">Right foot</span>
        <span class="tag">Available weekends</span>
      </div>
    </section>

    <section class="radar-panel">
      <div class="radar-head">
        <div>
          <h2>Player Attributes</h2>
          <p>FIFA-style radar for profile strength and football ability.</p>
        </div>
        <span class="tag gold">Goalbazi Card</span>
      </div>

      <div class="radar-wrap">
        <svg viewBox="0 0 360 360" role="img" aria-label="Player radar chart">
          <polygon class="grid" points="180,42 299.5,111 299.5,249 180,318 60.5,249 60.5,111"></polygon>
          <polygon class="grid" points="180,76.5 269.6,128.3 269.6,231.8 180,283.5 90.4,231.8 90.4,128.3"></polygon>
          <polygon class="grid" points="180,111 239.8,145.5 239.8,214.5 180,249 120.2,214.5 120.2,145.5"></polygon>
          <line class="axis" x1="180" y1="180" x2="180" y2="42"></line>
          <line class="axis" x1="180" y1="180" x2="299.5" y2="111"></line>
          <line class="axis" x1="180" y1="180" x2="299.5" y2="249"></line>
          <line class="axis" x1="180" y1="180" x2="180" y2="318"></line>
          <line class="axis" x1="180" y1="180" x2="60.5" y2="249"></line>
          <line class="axis" x1="180" y1="180" x2="60.5" y2="111"></line>

          <polygon class="shape" points="180,69.6 272,126.9 266.4,229.9 180,262.5 92.7,230.4 85.2,125.3"></polygon>
          <circle class="point" cx="180" cy="69.6" r="5"></circle>
          <circle class="point" cx="272" cy="126.9" r="5"></circle>
          <circle class="point" cx="266.4" cy="229.9" r="5"></circle>
          <circle class="point" cx="180" cy="262.5" r="5"></circle>
          <circle class="point" cx="92.7" cy="230.4" r="5"></circle>
          <circle class="point" cx="85.2" cy="125.3" r="5"></circle>

          <text class="label" x="180" y="25" text-anchor="middle">PAC</text>
          <text class="label" x="322" y="106" text-anchor="middle">SHO</text>
          <text class="label" x="323" y="263" text-anchor="middle">PAS</text>
          <text class="label" x="180" y="342" text-anchor="middle">DRI</text>
          <text class="label" x="37" y="263" text-anchor="middle">DEF</text>
          <text class="label" x="38" y="106" text-anchor="middle">PHY</text>
        </svg>

        <div class="stat-list">
          <div class="stat"><span class="stat-code">PAC</span><div class="bar"><span style="width:80%"></span></div><span class="stat-value">80</span></div>
          <div class="stat"><span class="stat-code">SHO</span><div class="bar"><span style="width:77%"></span></div><span class="stat-value">77</span></div>
          <div class="stat"><span class="stat-code">PAS</span><div class="bar"><span style="width:74%"></span></div><span class="stat-value">74</span></div>
          <div class="stat"><span class="stat-code">DRI</span><div class="bar"><span style="width:60%"></span></div><span class="stat-value">60</span></div>
          <div class="stat"><span class="stat-code">DEF</span><div class="bar"><span style="width:73%"></span></div><span class="stat-value">73</span></div>
          <div class="stat"><span class="stat-code">PHY</span><div class="bar"><span style="width:79%"></span></div><span class="stat-value">79</span></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
