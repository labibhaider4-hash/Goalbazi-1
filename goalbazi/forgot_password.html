<!DOCTYPE html>
<!-- Forgot password page: starts a secure one-hour reset flow without exposing registered emails. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goalbazi - Forgot Password</title>
  <link rel="icon" type="image/svg+xml" href="/assets/goalbazi-logo.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/goalbazi-logo.svg">
  <meta name="theme-color" content="#07110d">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .reset-help { color: var(--muted); font-size: .84rem; line-height: 1.55; }
    .reset-link-box {
      display:none;
      word-break: break-all;
      margin-top: 10px;
      border: 1px solid rgba(127,255,69,.22);
      background: rgba(127,255,69,.08);
      border-radius: 14px;
      padding: 11px;
      font-size: .82rem;
    }
    .success-msg {
      display:none;
      color: var(--brand);
      border: 1px solid rgba(127,255,69,.22);
      background: rgba(127,255,69,.08);
      border-radius: 14px;
      padding: 11px;
      font-size: .86rem;
    }
  </style>
</head>
<body class="goalbazi-app-bg">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-theme-corner">
        <button class="theme-toggle" id="forgot-theme-toggle" type="button" data-theme-toggle></button>
      </div>
      <div class="auth-logo">
        <img src="/assets/goalbazi-logo.svg" alt="Goalbazi">
        <span>Goalbazi</span>
      </div>
      <h1 class="auth-title">Reset password</h1>
      <p class="auth-sub">Enter your account email. If it exists, we will prepare a secure reset link.</p>
      <form class="auth-form" id="forgot-form">
        <label>
          <span>Email</span>
          <input class="form-input" type="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </label>
        <p class="error-msg" id="error-msg"></p>
        <p class="success-msg" id="success-msg"></p>
        <div class="reset-link-box" id="reset-link-box"></div>
        <button class="btn btn-primary btn-full" type="submit" id="submit-btn">Send reset link</button>
      </form>
      <p class="reset-help" style="margin-top:14px">If email is not configured yet, contact support and we can help you recover the account safely.</p>
      <p class="auth-switch"><a href="/login">Back to login</a></p>
      <p class="auth-switch" style="margin-top:8px"><a href="/support">Contact support</a></p>
    </div>
  </div>
  <script src="/nav.js"></script>
  <script>
    GoalbaziTheme.attachButton(document.getElementById("forgot-theme-toggle"));

    document.getElementById("forgot-form").addEventListener("submit", async event => {
      event.preventDefault();
      const btn = document.getElementById("submit-btn");
      const err = document.getElementById("error-msg");
      const success = document.getElementById("success-msg");
      const resetBox = document.getElementById("reset-link-box");
      err.style.display = "none";
      success.style.display = "none";
      resetBox.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Preparing...";
      try {
        const res = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(event.currentTarget).entries())),
        });
        const body = await res.json();
        success.textContent = body.email_sent
          ? "Reset email sent. Check your inbox."
          : `Reset request prepared. If no email arrives, contact ${body.support_email || "support"}.`;
        success.style.display = "block";
        if (body.reset_url) {
          resetBox.innerHTML = `Testing reset link:<br><a href="${body.reset_url}">${body.reset_url}</a>`;
          resetBox.style.display = "block";
        }
      } catch {
        err.textContent = "Network error. Please try again.";
        err.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
