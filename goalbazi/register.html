<!DOCTYPE html>
<!-- Registration page for athlete accounts. Arena Partners use owner_register.html. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goalbazi — Register</title>
  <link rel="icon" type="image/svg+xml" href="/assets/goalbazi-logo.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/goalbazi-logo.svg">
  <meta name="theme-color" content="#07110d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Goalbazi">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
   /* PREMIUM INPUTS */
.auth-form input{
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--text);
  font-size:.95rem;
  outline:none;
  transition:all .25s ease;
  backdrop-filter:blur(6px);
}

/* Placeholder */
.auth-form input::placeholder{
  color:var(--muted);
}

/* Focus */
.auth-form input:focus{
  background:var(--panel);
  border-color:rgba(63,126,42,0.7);
  box-shadow:
    0 0 0 2px rgba(63,126,42,0.15),
    0 8px 25px rgba(0,0,0,0.4);
}

/* Labels better contrast */
.auth-form span{ color:var(--muted-2); }

/* OPTIONAL: make side-by-side fields feel aligned */
.field-grid input{
  height:48px;
}

/* Password reveal controls help users catch typing mistakes before account creation. */
.password-field{
  position:relative;
}

.password-field input{
  padding-right:50px;
}

.password-toggle{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:34px;
  height:34px;
  border-radius:10px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:var(--muted-2);
  cursor:pointer;
  display:grid;
  place-items:center;
}

.password-toggle:hover{
  color:var(--accent);
  border-color:rgba(110,255,71,.35);
}

.password-toggle svg{
  width:18px;
  height:18px;
}
    .primary-btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(63,126,42,0.4);
  background:linear-gradient(135deg,#3F7E2A,#2a5a1d);
  color:#f7fff5;
  font-weight:700;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:all .3s ease;
}

/* 🔥 Glow effect */
.primary-btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.2),transparent);
  opacity:0;
  transition:.4s;
}

/* Hover */
.primary-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 10px 30px rgba(63,126,42,.4),
    0 0 20px rgba(63,126,42,.25);
}

.primary-btn:hover::before{
  opacity:1;
  animation:shine 1.2s linear;
}

/* Click */
.primary-btn:active{
  transform:scale(.97);
}

/* Disabled */
.primary-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
  box-shadow:none;
}

/* Shine animation */
@keyframes shine{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}
  </style>
</head>
<body class="goalbazi-app-bg">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-theme-corner">
        <button class="theme-toggle" id="register-theme-toggle" type="button" data-theme-toggle></button>
      </div>
      <div class="auth-logo">
        <img src="/assets/goalbazi-logo.svg" alt="Goalbazi">
        <span>Goalbazi</span>
      </div>
      <h1 class="auth-title">Join Goalbazi</h1>
      <p class="auth-sub">Create your athlete account to reserve arenas, join matches, and track leagues across Delhi NCR.</p>
      <form class="auth-form" id="register-form">
        <div class="field-grid">
          <label>
            <span>Full name</span>
            <input name="name" placeholder="Arjun Rawat" required>
          </label>
          <label>
            <span>Username</span>
            <input name="handle" placeholder="arjun07" required>
          </label>
        </div>
        <div style="color:var(--muted);font-size:.82rem;margin-top:-4px">Only lowercase letters and numbers are kept. Your profile will show it as <strong>@username</strong>.</div>
        <label>
          <span>Email</span>
          <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </label>
        <label>
          <span>Location</span>
          <input name="location" placeholder="South Delhi" required>
        </label>
        <label>
          <span>Password</span>
          <div class="password-field">
            <input id="register-password" type="password" name="password" placeholder="Min 8 characters" required autocomplete="new-password">
            <button class="password-toggle" type="button" data-toggle-password="register-password" aria-label="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5c5 0 8.5 4.1 9.7 5.8a2 2 0 0 1 0 2.4C20.5 14.9 17 19 12 19s-8.5-4.1-9.7-5.8a2 2 0 0 1 0-2.4C3.5 9.1 7 5 12 5Zm0 2c-4 0-6.9 3.4-8 5 1.1 1.6 4 5 8 5s6.9-3.4 8-5c-1.1-1.6-4-5-8-5Zm0 2.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"/></svg>
            </button>
          </div>
        </label>
        <label>
          <span>Confirm password</span>
          <div class="password-field">
            <input id="register-confirm-password" type="password" name="confirm_password" placeholder="Re-enter password" required autocomplete="new-password">
            <button class="password-toggle" type="button" data-toggle-password="register-confirm-password" aria-label="Show confirm password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5c5 0 8.5 4.1 9.7 5.8a2 2 0 0 1 0 2.4C20.5 14.9 17 19 12 19s-8.5-4.1-9.7-5.8a2 2 0 0 1 0-2.4C3.5 9.1 7 5 12 5Zm0 2c-4 0-6.9 3.4-8 5 1.1 1.6 4 5 8 5s6.9-3.4 8-5c-1.1-1.6-4-5-8-5Zm0 2.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"/></svg>
            </button>
          </div>
        </label>
        <p class="error-msg" id="error-msg"></p>
        <button class="primary-btn" type="submit" id="submit-btn">Create account</button>
        <a class="btn btn-ghost btn-full" href="/auth/google" style="margin-top:8px">Continue with Google</a>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
      <p class="auth-switch" style="margin-top:8px"><a href="/">Back to landing page</a></p>
    </div>
  </div>
  <script src="/nav.js"></script>
  <script>
    GoalbaziTheme.attachButton(document.getElementById("register-theme-toggle"));

    const params = new URLSearchParams(window.location.search);
    const googleError = params.get("error");
    if (googleError) {
      const err = document.getElementById("error-msg");
      const messages = {
        google_not_configured: "Google login is not configured yet.",
        google_cancelled: "Google sign-in was cancelled.",
        google_state: "Google sign-in expired. Please try again.",
        google_missing_code: "Google sign-in did not complete. Please try again.",
        google_failed: "Google sign-in failed. Please try again.",
        google_profile: "Google did not return a usable profile.",
      };
      err.textContent = messages[googleError] || "Google sign-in failed. Please try again.";
      err.style.display = "block";
    }

    const handleInput = document.querySelector('input[name="handle"]');
    handleInput.addEventListener("input", () => {
      handleInput.value = handleInput.value.toLowerCase().replace(/[^a-z0-9]/g, "");
    });

    // Reusable password reveal buttons keep login/register behavior consistent.
    document.querySelectorAll("[data-toggle-password]").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.togglePassword);
        const shouldShow = input.type === "password";
        input.type = shouldShow ? "text" : "password";
        button.setAttribute("aria-label", shouldShow ? "Hide password" : "Show password");
      });
    });

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      const err = document.getElementById("error-msg");
      const data = Object.fromEntries(new FormData(e.currentTarget).entries());
      err.style.display = "none";

      // Confirm password is checked on the browser first so accidental typos are caught instantly.
      if (data.password !== data.confirm_password) {
        err.textContent = "Passwords do not match.";
        err.style.display = "block";
        return;
      }
      delete data.confirm_password;

      btn.textContent = "Creating account...";
      btn.disabled = true;
      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (res.ok) {
          window.location.href = "/";
        } else {
          const body = await res.json();
          err.textContent = body.error || "Registration failed";
          err.style.display = "block";
        }
      } catch {
        err.textContent = "Network error — please try again";
        err.style.display = "block";
      } finally {
        btn.textContent = "Create account";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
