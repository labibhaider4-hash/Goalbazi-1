[build]
# Keep Railway on Nixpacks and let it install the root requirements.txt.
builder = "NIXPACKS"

[deploy]
# Railway starts from the repository root, so enter the app folder first.
startCommand = "gunicorn --chdir goalbazi server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
